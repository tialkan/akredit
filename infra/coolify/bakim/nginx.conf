# Güncelleme sırasında ana uygulama kısa süre yokken Traefik'in "no available server" yerine bu sayfa döner.
# Her istek 503 ve Retry-After ile yanıtlanır; arama motorları ve MCP istemcileri bunu geçici hata sayar.
server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  location = /isaret.svg { add_header Cache-Control "public, max-age=86400"; try_files /isaret.svg =404; }
  location / {
    add_header Retry-After 15 always;
    add_header Cache-Control "no-store" always;
    return 503;
  }
  error_page 503 /index.html;
  location = /index.html { internal; add_header Retry-After 15 always; add_header Cache-Control "no-store" always; }
}
