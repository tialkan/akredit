# Akredit: Coolify dağıtımı (yarenler-01, Hetzner CAX21 arm64).
# İmajlar sunucuda depodan derlenir. Ters vekil ve TLS Coolify'ındır (Caddy yok).
# Gizli değerler Coolify'ın SERVICE_PASSWORD_* / SERVICE_BASE64_* değişkenleriyle üretilir; depoya girmez.
# Alan adı Coolify arayüzünde "web" hizmetine verilir (SERVICE_FQDN_WEB_3000).

x-gunluk: &gunluk
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  web:
    <<: *gunluk
    build:
      context: .
      dockerfile: infra/gelistirme/web.Dockerfile
      # Sürüm işareti (x-app-version, İP-49): Coolify derlemede SOURCE_COMMIT'i verir.
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-bilinmiyor}
    restart: unless-stopped
    environment:
      SERVICE_FQDN_WEB_3000: null
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      AKREDIT_ADRES: ${SERVICE_FQDN_WEB}
      AKREDIT_VT_ADRES: postgres://akredit_uyg:${SERVICE_PASSWORD_UYGULAMA}@vt:5432/akredit
      AKREDIT_ONAY_GIZLI: ${SERVICE_BASE64_64_ONAY}
      # İP-41: sentetik Örnek Üniversitesi demosu. Varsayılan KAPALI (12.11.2026): demo askıda ve bu kurulumda
      # kimlik gizlisi (AKREDIT_KIMLIK_GIZLI) tanımlı değil; açıkken /panel 500 veriyordu. Kapalıyken /panel ve
      # /degerlendirici /kurum-demosu tanıtımına yönlenir. Açmak için Coolify'da AKREDIT_DEMO=1 ve kimlik gizlisi verin.
      # Tarayıcı araçları (/deneyin) ve açık MCP bu bayraktan etkilenmez.
      AKREDIT_DEMO: ${AKREDIT_DEMO:-0}
      # ADR 0008: barındırılan kurum hizmeti (kurum açma, pilot başvurusu, kurum girişi) sponsor bulunana kadar
      # askıda. Varsayılan 0 (kapalı); 1 açar. Demo ve /mcp bu bayraktan etkilenmez.
      AKREDIT_BARINDIRMA: ${AKREDIT_BARINDIRMA:-0}
      AKREDIT_ANKET_GIZLI: ${SERVICE_BASE64_64_ANKET}
      # İP-45: hesapsız belge isteme bağlantılarının HMAC anahtarı (Coolify üretir).
      AKREDIT_ISTEK_GIZLI: ${SERVICE_BASE64_64_ISTEK}
      # Açık MCP: kaynak doğrulama imzası; süreç yeniden başlasa da geçerli kalsın (İP-49).
      AKREDIT_MCP_IMZA_ANAHTARI: ${SERVICE_BASE64_64_MCPIMZA}
      AKREDIT_ANAHTAR_KASASI: ${SERVICE_BASE64_64_KASA}
      AKREDIT_SMTP_SUNUCU: ${AKREDIT_SMTP_SUNUCU:-}
      AKREDIT_SMTP_PORT: ${AKREDIT_SMTP_PORT:-587}
      AKREDIT_SMTP_KULLANICI: ${AKREDIT_SMTP_KULLANICI:-}
      AKREDIT_SMTP_PAROLA: ${AKREDIT_SMTP_PAROLA:-}
      AKREDIT_EPOSTA_GONDEREN: ${AKREDIT_EPOSTA_GONDEREN:-}
      # Pilot başvurusu bildiriminin alıcısı (İP-42). Boşsa başvuru yalnız kaydedilir, günlüğe uyarı yazılır.
      AKREDIT_PILOT_ALICI: ${AKREDIT_PILOT_ALICI:-}
      # Kanıt deposu: işçiyle aynı birim ve aynı imza gizlisi (site taraması, Bologna okuma kaydı, Word paketi).
      AKREDIT_DEPO_DIZINI: /veri/kanit
      AKREDIT_DEPO_IMZA_GIZLISI: ${SERVICE_BASE64_64_DEPO}
    volumes:
      - akredit-kanit:/veri/kanit
    # Kurucu kararı (12.11.2026, review.md madde 3): web, veritabanını ve göçü BEKLEMEZ. Tanıtım sitesi, /deneyin ve
    # açık MCP (/mcp) veritabanı kullanmaz; vt ya da goc düşse de açılmalıdır. Veritabanı bağlantısı ilk API
    # isteğinde kurulur (apps/web/src/app/api/_ortak/sunucu.ts); vt yokken yalnız askıdaki panel, demo ve API uçları
    # hata verir. Sağlık denetimi (web.Dockerfile HEALTHCHECK) ana sayfaya bakar, o da veritabanı kullanmaz.

  isci:
    <<: *gunluk
    build:
      context: .
      dockerfile: infra/uretim/isci.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AKREDIT_VT_ADRES: postgres://akredit_uyg:${SERVICE_PASSWORD_UYGULAMA}@vt:5432/akredit
      AKREDIT_ANAHTAR_KASASI: ${SERVICE_BASE64_64_KASA}
      AKREDIT_SMTP_SUNUCU: ${AKREDIT_SMTP_SUNUCU:-}
      AKREDIT_SMTP_PORT: ${AKREDIT_SMTP_PORT:-587}
      AKREDIT_SMTP_KULLANICI: ${AKREDIT_SMTP_KULLANICI:-}
      AKREDIT_SMTP_PAROLA: ${AKREDIT_SMTP_PAROLA:-}
      AKREDIT_EPOSTA_GONDEREN: ${AKREDIT_EPOSTA_GONDEREN:-}
      AKREDIT_BAGLAYICI_ANAHTARI: ${SERVICE_BASE64_64_BAGLAYICI}
      # İP-41: demo kiracısının gece yenilemesi (web ile aynı değer olmalı; varsayılan kapalı).
      AKREDIT_DEMO: ${AKREDIT_DEMO:-0}
      AKREDIT_DEPO_DIZINI: /veri/kanit
      AKREDIT_DEPO_IMZA_GIZLISI: ${SERVICE_BASE64_64_DEPO}
    volumes:
      - akredit-kanit:/veri/kanit
    depends_on:
      vt: { condition: service_healthy }
      goc: { condition: service_completed_successfully }

  # Güncelleme sırasında web kapsayıcısı kısa süre yokken Traefik "no available server" gösterirdi.
  # Bu hizmet aynı alan adı için en düşük öncelikli yönlendiricidir: web hazır olduğu sürece hiç kullanılmaz,
  # web yokken ya da sağlıksızken tasarıma uygun "kısa bir güncelleme" sayfasını 503 ile verir.
  # İmajı değişmediği için güncellemelerde yeniden başlatılmaz.
  bakim:
    <<: *gunluk
    build:
      context: .
      dockerfile: infra/coolify/bakim.Dockerfile
    restart: unless-stopped
    exclude_from_hc: true
    labels:
      - traefik.enable=true
      - traefik.http.routers.akredit-bakim-http.rule=Host(`akredit.org`) || Host(`www.akredit.org`)
      - traefik.http.routers.akredit-bakim-http.entrypoints=http
      - traefik.http.routers.akredit-bakim-http.priority=1
      - traefik.http.routers.akredit-bakim-http.service=akredit-bakim
      - traefik.http.routers.akredit-bakim.rule=Host(`akredit.org`) || Host(`www.akredit.org`)
      - traefik.http.routers.akredit-bakim.entrypoints=https
      - traefik.http.routers.akredit-bakim.tls=true
      - traefik.http.routers.akredit-bakim.priority=1
      - traefik.http.routers.akredit-bakim.service=akredit-bakim
      - traefik.http.services.akredit-bakim.loadbalancer.server.port=80

  # Göçleri süper kullanıcıyla bir kez uygular, sonra çıkar. Yeniden çalıştırmak güvenlidir.
  goc:
    <<: *gunluk
    build:
      context: .
      dockerfile: infra/uretim/isci.Dockerfile
    command: ["node", "infra/uretim/goc.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://akredit:${SERVICE_PASSWORD_VT}@vt:5432/akredit
    exclude_from_hc: true
    depends_on:
      vt: { condition: service_healthy }

  vt:
    <<: *gunluk
    build:
      context: .
      dockerfile: infra/coolify/vt.Dockerfile
    # WAL arşivi Coolify'da KAPALI (kesinti 2026-11-11): ayar dosyasındaki archive_command '/yedek/wal-arsivle.sh'
    # üretim kurulumunun (infra/uretim) yedek birimine dayanır; burada o birim yok. Arşivleme hep başarısız olunca
    # PostgreSQL WAL'ları silemedi, archive_timeout=300 her 5 dakikada 16 MB'lık dosya açtı ve 13 günde 61 GB birikip
    # diski doldurdu. Bu kurulumda zaman noktasına dönüş yedeği YOKTUR; açmak için önce yedek birimi ve betiği bağlanmalı.
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "archive_mode=off",
        "-c",
        "archive_timeout=0",
      ]
    restart: unless-stopped
    shm_size: 1g
    environment:
      POSTGRES_USER: akredit
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_VT}
      POSTGRES_DB: akredit
      POSTGRES_INITDB_ARGS: --data-checksums
      YEDEK_KULLANICI: akredit_yedek
      YEDEK_PAROLA: ${SERVICE_PASSWORD_YEDEK}
      UYGULAMA_VT_KULLANICI: akredit_uyg
      UYGULAMA_VT_PAROLA: ${SERVICE_PASSWORD_UYGULAMA}
      IZLEME_VT_KULLANICI: akredit_izleme
      IZLEME_VT_PAROLA: ${SERVICE_PASSWORD_IZLEME}
    volumes:
      - akredit-vt:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akredit -d akredit"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  akredit-vt:
  akredit-kanit:
