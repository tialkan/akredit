# Derlenmiş imaj taraması için gitleaks yapılandırması: varsayılan kurallar ve dar istisnalar.
# Next.js derleme çıktısı (sıkıştırılmış kütüphane kodu, önizleme kipi anahtarları, yönetim listeleri)
# gizli değer taşımaz: Akredit'in gizlileri yalnız ortam değişkeniyle gelir ve imaja girmez.
# Önizleme (draft) kipi kullanılmaz; o anahtarlar derlemeye özgüdür.
# Bu dosyanın kendisi de imaja kopyalandığı için istisnadadır.
[extend]
useDefault = true

[allowlist]
description = "Derleme çıktısındaki kütüphane kodu ve derleme listeleri"
paths = [
  '''\.next/server/chunks/''',
  '''\.next/server/[a-z-]+-manifest\.json$''',
  '''\.next/server/preview-props\.json$''',
  '''\.next/prerender-manifest\.json$''',
  '''infra/guvenlik/gitleaks-imaj\.toml$''',
]
