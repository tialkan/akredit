# Üretim PostgreSQL ayarları (docker-compose.yml: -c config_file=...).
# Bellek değerleri 8 GB RAM'li tek sunucu için başlangıçtır; sunucuya göre ayarlayın.

listen_addresses = '*'
max_connections = 100
password_encryption = scram-sha-256

shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB

# WAL arşivi ve zaman noktasına dönüş (docs/isletim/yedekleme-ve-geri-donus.md)
wal_level = replica
archive_mode = on
archive_command = '/yedek/wal-arsivle.sh %p %f'
# En çok 5 dakikalık veri kaybı hedefi (RPO): boş sistemde bile WAL en geç 5 dakikada arşivlenir.
archive_timeout = 300
max_wal_senders = 4
wal_compression = on

# Günlük: kişisel veri ve sorgu parametreleri günlüğe yazılmaz (ilke 7, 8).
log_destination = 'stderr'
log_min_duration_statement = -1
log_statement = 'none'
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d '

hba_file = '/var/lib/postgresql/data/pg_hba.conf'
