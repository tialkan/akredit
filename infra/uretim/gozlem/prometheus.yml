global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/uyarilar.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: dugum
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: postgres
    static_configs:
      - targets: ["pg-exporter:9187"]
  - job_name: uygulama
    static_configs:
      - targets: ["otel:8889"]
  - job_name: durum
    metrics_path: /metrics
    static_configs:
      - targets: ["gatus:8080"]
