# OpenTelemetry toplayıcı: web ve işçiden OTLP alır.
# Ölçüler Prometheus'a açılır (otel:8889). İzler ve günlükler bu aşamada dışa aktarılmaz:
# yalnız örneklenmiş hata özeti debug çıktısına yazılır (kişisel veri içermemesi uygulama işidir).
# Bir iz deposu (ör. Tempo/Jaeger) eklendiğinde `traces` hattına dışa aktarıcı eklenir.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
  # Kişisel veri olabilecek öznitelikler dışa aktarılmadan silinir (ilke 7, 8).
  attributes/kisisel:
    actions:
      - key: enduser.id
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: client.address
        action: delete
      - key: url.query
        action: delete

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 1000

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/kisisel, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/kisisel, batch]
      exporters: [debug]
