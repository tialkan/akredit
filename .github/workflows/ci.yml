name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dogrula:
    name: Doğrula (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      - name: Biçim, tip ve testler
        run: pnpm verify
      - name: Web derlemesi
        run: pnpm --filter @akredit/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  uctan-uca:
    name: Uçtan uca (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: dogrula
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      - name: Tarayıcı
        if: hashFiles('apps/web/e2e/**/*.ts') != ''
        run: pnpm --filter @akredit/web exec playwright install --with-deps chromium
      - name: Web derlemesi
        if: hashFiles('apps/web/e2e/**/*.ts') != ''
        run: pnpm --filter @akredit/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Erişilebilirlik (axe, klavye) ve performans bütçeleri (e2e/butceler.ts) burada denetlenir; aşım işi kırar.
      - name: Uçtan uca testler
        if: hashFiles('apps/web/e2e/**/*.ts') != ''
        run: pnpm --filter @akredit/web e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  postgres:
    name: Gerçek PostgreSQL (göçler, eşzamanlı günlük)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      vt:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: akredit
          POSTGRES_PASSWORD: ci-yalniz
          POSTGRES_DB: akredit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akredit -d akredit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://akredit:ci-yalniz@localhost:5432/akredit
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      - name: Göçleri uygula
        run: node infra/gelistirme/goc.ts
      - name: Eşzamanlı göç ve günlük sınaması
        run: node infra/gelistirme/vt-sinama.ts

  imajlar:
    name: Docker imajları
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        uygulama: [web, isci]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: İmajı derle
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/gelistirme/${{ matrix.uygulama }}.Dockerfile
          tags: akredit-${{ matrix.uygulama }}:ci
          load: true
          push: false
      - name: İmajda gizli bilgi taraması
        run: |
          # İmaj dosya sistemi açılıp taranır; .env, anahtar ya da parola bulunursa iş kalır.
          mkdir imaj && docker export "$(docker create akredit-${{ matrix.uygulama }}:ci)" | tar -x -C imaj
          if find imaj -name '.env' -o -name '.env.*' -not -name '.env.ornek' | grep -q .; then echo "İmajda .env dosyası var"; exit 1; fi
          docker run --rm -v "$PWD/imaj/uygulama:/tara:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 dir /tara --no-banner --redact
      - name: Kök olmayan kullanıcı denetimi
        run: test "$(docker inspect -f '{{.Config.User}}' akredit-${{ matrix.uygulama }}:ci)" = "node"

  gizli-bilgi:
    name: Gizli bilgi taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/depo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /depo --no-banner --redact

  bagimlilik-incelemesi:
    name: Bağımlılık incelemesi
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-or-later
