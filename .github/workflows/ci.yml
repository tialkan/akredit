name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hangi işlerin gerektiğini değişen yollardan bulur. Atlanan işler "skipped" olur ve zorunlu kontrolde başarılı
  # sayılır. Biçim, tip ve bütün paketlerin testleri (acik-mcp dahil) ve gizli bilgi taraması her zaman çalışır.
  degisiklik:
    name: Değişen yollar
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.yollar.outputs.web }}
      isci: ${{ steps.yollar.outputs.isci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Yolları karşılaştır
        id: yollar
        env:
          TABAN: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Taban bilinmiyorsa (yeni dal, zorla itme) her şey çalışır.
          if ! git cat-file -e "$TABAN^{commit}" 2>/dev/null; then
            echo "web=true" >> "$GITHUB_OUTPUT"; echo "isci=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "$TABAN" "$GITHUB_SHA" > "$RUNNER_TEMP/yollar.txt"
          ORTAK='^(packages/|pnpm-lock\.yaml|package\.json|pnpm-workspace\.yaml|tsconfig[^/]*\.json|\.github/workflows/ci\.yml)'
          var() { grep -qE "$1" "$RUNNER_TEMP/yollar.txt" && echo true || echo false; }
          echo "web=$(var "$ORTAK|^apps/web/|^apps/acik-mcp/|^infra/gelistirme/web\.Dockerfile")" >> "$GITHUB_OUTPUT"
          echo "isci=$(var "$ORTAK|^apps/isci/|^infra/")" >> "$GITHUB_OUTPUT"

  dogrula:
    name: Doğrula (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: degisiklik
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      - name: Tarayıcı (Bologna yazma bağlayıcısının uçtan uca testi için)
        run: pnpm --filter @akredit/web exec playwright install --with-deps chromium
      - name: Biçim, tip ve testler
        env:
          NO_COLOR: "1"
        run: |
          # Her adım ayrı koşar; hata olursa son satırları işaret olarak yazılır (en çok 10 işaret).
          for adim in check typecheck test; do
            if ! pnpm "$adim" > "$RUNNER_TEMP/$adim.log" 2>&1; then
              cat "$RUNNER_TEMP/$adim.log"
              echo "::error::$adim adımı başarısız"
              { grep -A4 -E "Unhandled|⎯⎯ (Errors|Failed)" "$RUNNER_TEMP/$adim.log" | grep -vE "^\s*$|⎯" | head -6; grep -vE "^\s*$|non-null|ℹ|│" "$RUNNER_TEMP/$adim.log" | tail -3; } | cut -c1-400 | sed 's/^/::error::/'
              exit 1
            fi
            tail -3 "$RUNNER_TEMP/$adim.log"
          done
      - name: Web derlemesi
        if: needs.degisiklik.outputs.web == 'true'
        run: pnpm --filter @akredit/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  uctan-uca:
    name: Uçtan uca (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [degisiklik, dogrula]
    if: needs.degisiklik.outputs.web == 'true'
    env:
      # playwright.config.ts yerel varsayılanı /opt/pw-browsers; kurulum ve testler aynı dizini kullanmalı.
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      - name: Tarayıcı
        if: hashFiles('apps/web/e2e/**/*.ts') != ''
        run: pnpm --filter @akredit/web exec playwright install --with-deps chromium
      - name: Web derlemesi
        if: hashFiles('apps/web/e2e/**/*.ts') != ''
        run: pnpm --filter @akredit/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Panel sayfaları örnek veriyle sınanır; üretim derlemesi (dogrula işi) gerçek veri kipindedir.
          AKREDIT_ORNEK_VERI: "1"
      # Erişilebilirlik (axe, klavye) ve performans bütçeleri (e2e/butceler.ts) burada denetlenir; aşım işi kırar.
      - name: Uçtan uca testler
        if: hashFiles('apps/web/e2e/**/*.ts') != ''
        # github raporlayıcısı her başarısız testi dosya ve satırıyla işaret olarak yazar.
        run: pnpm --filter @akredit/web e2e --reporter=github,list
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  postgres:
    name: Gerçek PostgreSQL (göçler, eşzamanlı günlük, işçi)
    needs: degisiklik
    if: needs.degisiklik.outputs.isci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      vt:
        # Kesin sürüm etiketi; özetle (@sha256) sabitleme ağ erişimli ortamda yapılmalı (İP-27 raporu).
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: akredit
          POSTGRES_PASSWORD: ci-yalniz
          POSTGRES_DB: akredit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U akredit -d akredit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://akredit:ci-yalniz@localhost:5432/akredit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22
      - name: pnpm
        run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      - name: Göçleri uygula
        run: node infra/gelistirme/goc.ts
      - name: Eşzamanlı göç ve günlük sınaması
        run: node infra/gelistirme/vt-sinama.ts
      # İşçi gerçek pg-boss ile: ZIP kanıt → hat → onay bekleyen öneri, süreç hatırlatması, SIGTERM (İP-36).
      - name: İşçi uçtan uca
        run: bash infra/gelistirme/isci-uctan-uca.sh

  imajlar:
    name: Docker imajları
    needs: degisiklik
    # Matris öğesi kendi yolu değişmediyse adımları atlar; iş yine başarılı biter (zorunlu kontrol kırılmaz).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        uygulama: [web, isci]
    env:
      GEREKLI: ${{ matrix.uygulama == 'web' && needs.degisiklik.outputs.web || needs.degisiklik.outputs.isci }}
    steps:
      - name: Atlandı
        if: env.GEREKLI != 'true'
        run: echo "${{ matrix.uygulama }} yolları değişmedi; imaj derlenmedi."
      - if: env.GEREKLI == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.GEREKLI == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: İmajı derle
        if: env.GEREKLI == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/gelistirme/${{ matrix.uygulama }}.Dockerfile
          tags: akredit-${{ matrix.uygulama }}:ci
          load: true
          push: false
      - name: İmajda gizli bilgi taraması
        if: env.GEREKLI == 'true'
        run: |
          # İmaj dosya sistemi açılıp taranır; .env, anahtar ya da parola bulunursa iş kalır.
          mkdir imaj && docker export "$(docker create akredit-${{ matrix.uygulama }}:ci)" | tar -x -C imaj
          if find imaj -name '.env' -o -name '.env.*' -not -name '.env.ornek' | grep -q .; then echo "İmajda .env dosyası var"; exit 1; fi
          R="$PWD/gitleaks-imaj.json"; touch "$R"; chmod 666 "$R"
          docker run --rm -v "$PWD/imaj/uygulama:/tara:ro" -v "$R:/rapor.json" -v "$PWD/infra/guvenlik/gitleaks-imaj.toml:/ayar.toml:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 dir /tara --config /ayar.toml --no-banner --redact --report-format json --report-path /rapor.json || { jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) \(.Commit[0:7])"' "$R"; exit 1; }
      - name: Kök olmayan kullanıcı denetimi
        if: env.GEREKLI == 'true'
        run: test "$(docker inspect -f '{{.Config.User}}' akredit-${{ matrix.uygulama }}:ci)" = "node"

  gizli-bilgi:
    name: Gizli bilgi taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          # Bulgular dosya ve satırıyla işaret olarak yazılır (gizli değer --redact ile gizli kalır).
          R="$RUNNER_TEMP/gitleaks.json"; touch "$R"; chmod 666 "$R"
          docker run --rm -v "$PWD:/depo" -v "$R:/rapor.json" ghcr.io/gitleaks/gitleaks:v8.28.0 git /depo --no-banner --redact --report-format json --report-path /rapor.json || { jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) \(.Commit[0:7])"' "$R"; exit 1; }

  bagimlilik-incelemesi:
    name: Bağımlılık incelemesi
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-or-later
