# Haftalık, gruplanmış bağımlılık güncellemeleri.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      gelistirme:
        dependency-type: development
        update-types: [minor, patch]
      uretim:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      eylemler:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/infra/gelistirme]
    schedule:
      interval: weekly
    groups:
      imajlar:
        patterns: ["*"]
